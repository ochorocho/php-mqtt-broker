# fail2ban filter for the PHP MQTT broker.
#
# Install as /etc/fail2ban/filter.d/mqtt-broker.conf
#
# WHAT THIS MATCHES, AND WHAT IT DELIBERATELY DOES NOT.
#
# It matches authentication failures only -- a username and password that did not
# verify. Those are the lines worth banning on: the credential is wrong, so no
# legitimate client produces them in a loop.
#
# The broker also logs a refused CLIENT ID:
#
#   Client ID mosq-AbC123 not allowed for alice from 10.0.0.5:51234
#
# That line is DIAGNOSTIC. Do not add it to failregex. It means the password was
# correct and only the client ID was wrong, which is what a misconfigured device
# emits on every reconnect, forever. With maxretry 5 a single ESPHome device whose
# client_id does not match its username would ban its whole site within seconds of
# a rollout -- and if you are debugging from the same address as your MQTT client,
# it bans you out of your own diagnosis. An attacker who already holds valid
# credentials has no need to guess client IDs, so the detection value is low and
# the self-inflicted-outage risk is high.
#
# If you ever do want to act on it, give it its own filter and jail with a much
# higher maxretry and a longer findtime. Do not loosen the pattern below into
# something like "warning: .* from <HOST>" -- that would also swallow every future
# warning that happens to carry an address.

[Definition]

failregex = ^\[.*\] warning: Authentication failed for .* from <HOST>:\d+

ignoreregex =

# No datepattern is set on purpose. With the systemd backend this jail ships with,
# journald supplies the timestamp and the broker's own [2026-09-13 14:11:56+00:00]
# prefix is never what fail2ban parses -- so a pattern here would be dead config that
# looks authoritative. If you switch to the logpath backend and fail2ban reports
# "found a match but no valid date", add one then and check it with fail2ban-regex
# first: the broker's offset is written +00:00, with the colon, which not every
# strptime accepts as %z.
